/**:
  ros__parameters:
    model:
      repo_id: ""
      policy_class: "lerobot.policies.pi05.modeling_pi05.PI05Policy"
      device: "cuda"
      use_amp: false
      use_relative_actions: false

    runtime:
      control_hz: 6.0
      actions_per_chunk: 50
      chunk_size_threshold: 0.6
      aggregate_fn_name: weighted_average
      async_enabled: true
      single_step_mode: false
      max_joint_delta_per_step: 0.15

    rtc:
      # PI05 does not expose predict_action_chunk — keep disabled to avoid spurious warnings.
      enabled: false
      execution_horizon: 6
      max_guidance_weight: 10.0
      prefix_attention_schedule: EXP
      inference_delay: 4
      debug: false

    logging:
      # Episode evaluation logging. The vla_experiment.launch.py overrides
      # enabled/log_dir per model run; these are the defaults for plain deploy.
      enabled: false
      log_dir: "/tmp/vla_logs"
      tilt_threshold_deg: 30.0
      # Automatic episode termination thresholds.
      episode_timeout_s: 60.0   # stop after 60 sim seconds
      lift_success_m: 0.05      # block lifted > 5 cm -> success
      fall_z_drop_m: 0.15       # robot world-z drop > 15 cm -> fallen

    reset:
      action_name: "/sobit_home/move_to_pose"

    sim:
      robot_model_name: sobit_home

    robot:
      # Morphology is loaded from the shared robot descriptor:
      #   sobits_vla_common/robots/sobit_home.robot.yaml
      # This config activates all groups and cameras (both arms/hands).
      descriptor_id: sobit_home
      active_groups:
        - head
        - body
        - arm_left
        - arm_right
        - hand_left
        - hand_right
      active_cameras:
        - head_camera
        - hand_left_camera
        - hand_right_camera
      active_mobile_base: true
