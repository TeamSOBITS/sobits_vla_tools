/**:
  ros__parameters:
    model:
      # PI0 (PaliGemma 2B + 300M action expert) VLM-LoRA adapter trained on
      # left-abs-gazebo (training_config_sobit_home_left_pi0_vlmlora.yaml).
      # Adapter-only repo: the loader merges it onto lerobot/pi0_base.
      # Trained with use_relative_actions: false and the repo's
      # absolute_actions_processor has enabled: false — keep false here.
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_pi0_vlmlora"
      policy_class: "lerobot.policies.pi0.modeling_pi0.PI0Policy"
      device: "cuda"
      use_amp: false
      use_relative_actions: false
      default_task_label: "Pick up the block"

    runtime:
      # Must match dataset fps (10) — actions are positions sampled at 10 Hz.
      control_hz: 10.0
      actions_per_chunk: 50
      # Re-infer when the queue drops to 50% (25 steps left): leaves margin
      # for ~1.5 s pi0 inference latency without the queue running dry.
      chunk_size_threshold: 0.5
      # Non-RTC fallback path only; 'newest' avoids blending chunks predicted
      # from observations ~1 s apart.
      aggregate_fn_name: newest
      async_enabled: true
      single_step_mode: false
      # NOTE: per-group joint rate limiting (max_joint_delta) comes from the
      # robot descriptor (sobits_vla_common/robots/sobit_home.robot.yaml).

    rtc:
      # pi0 exposes predict_action_chunk + rtc_config (registry supports_rtc).
      # The trained config.json has rtc_config: null; the deploy loader injects
      # an RTCConfig at load time.
      enabled: true
      # >= ceil(inference_latency * control_hz), <= chunk_size/2.
      # 16 covers ~1.5 s at 10 Hz (same budget as the pi05 sibling config).
      execution_horizon: 16
      max_guidance_weight: 10.0
      prefix_attention_schedule: EXP
      # Floor; the deploy node's LatencyTracker raises it from measurements.
      inference_delay: 5
      debug: false

    logging:
      enabled: false
      log_dir: ""

    task:
      # Selects which block below defines success.
      mode: pick

      common:
        robot_model_name: sobit_home
        tracked_model_name: box_to_pick
        episode_timeout_s: 60.0
        success_settle_s: 2.0
        tilt_threshold_deg: 30.0
        fall_z_drop_m: 0.15

      # success_lift once tracked_model rises lift_success_m.
      pick:
        lift_success_m: 0.05


    robot:
      # Trims the shared sobit_home descriptor to the left-arm 19-dim subset
      # matching the model's action_feature_names (head 2 + body 1 +
      # arm_left 6 + hand_left 7 + base 3): exclude arm_right/hand_right
      # wholesale and drop arm_left_lower_flex_joint, which the deployed
      # checkpoint's 19-dim action/state space does not include.
      descriptor_id: sobit_home
      exclude:
        groups: [arm_right, hand_right]
        cameras: [hand_right_camera]
        ee_poses: [right]
        joints: [arm_left_lower_flex_joint]
        mobile_base: false
