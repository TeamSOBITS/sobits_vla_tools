/**:
  ros__parameters:
    model:
      # GR00T N1.7-3B post-trained on the left-abs dataset (full-model repo).
      #
      # IMPORTANT: lerobot 0.6.0 dropped GR00T N1.5 support entirely — the
      # repo below must point at an N1.7 fine-tune. An existing N1.5
      # fine-tune of this task CANNOT be loaded by lerobot 0.6.0; retrain
      # against N1.7 (nvidia/GR00T-N1.7-3B, Cosmos-Reason2-2B backbone)
      # before deploying with this config again. repo_id is left unchanged
      # here — it must be re-pushed under this same id after the N1.7 retrain.
      #
      # REQUIREMENTS:
      #  - N1.7 uses the Qwen3-VL/Cosmos-Reason2 backbone; flash-attn is
      #    optional (GrootConfig.use_flash_attention: false falls back to SDPA).
      #  - dataset_repo_id MUST be set: lerobot's factory injects dataset stats
      #    into the groot processor at load time; without them normalization
      #    is broken (the node warns and refuses silently-wrong behaviour).
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_groot"
      policy_class: "lerobot.policies.groot.modeling_groot.GrootPolicy"
      device: "cuda"
      use_amp: false
      use_relative_actions: false
      default_task_label: "Pick up the block"
      dataset_repo_id: "team-sobits/sobit_home-pickup_the_block-left-abs-gazebo"

    runtime:
      # Must match dataset fps (10).
      control_hz: 10.0
      actions_per_chunk: 50
      # GR00T flow-matching inference on a 12 GB GPU: expect a few hundred ms.
      # 0.5 leaves margin; raise toward 0.7 if measured latency is low.
      chunk_size_threshold: 0.5
      aggregate_fn_name: newest
      async_enabled: true
      single_step_mode: false
      # NOTE: joint rate limiting is configured per group via
      # robot.groups.<group>.max_joint_delta (rad): commands are clamped to
      # measured_position +- max_joint_delta each cycle.

    rtc:
      # GrootConfig has no rtc_config — the node auto-disables RTC.
      enabled: false
      execution_horizon: 16
      max_guidance_weight: 10.0
      prefix_attention_schedule: EXP
      inference_delay: 5
      debug: false


    task:
      # Selects which block below defines success.
      mode: pick

      common:
        robot_model_name: sobit_home
        tracked_model_name: box_to_pick

      # success_lift once tracked_model rises lift_success_m.
      pick:
        lift_success_m: 0.05

    robot:
      # Morphology (joint groups, command topics, joints, max_joint_delta,
      # mobile_base, cameras) is loaded from the shared robot descriptor:
      #   sobits_vla_common/robots/sobit_home.robot.yaml
      # exclude trims it to the subset this task uses (left-arm pickup)
      # without re-listing joints/topics. Unknown names raise.
      descriptor_id: sobit_home
      exclude:
        groups: ["arm_right", "hand_right"]
        # 19-dim pickup checkpoint (v1.1 data): the current robot has this
        # joint but the model does not know it.
        joints: ["arm_left_lower_flex_joint"]
        cameras: ["hand_right_camera"]
        ee_poses: ["right"]
        mobile_base: false
