/**:
  ros__parameters:
    model:
      # GR00T N1.5-3B post-trained on the left-abs dataset (full-model repo).
      # REQUIREMENTS:
      #  - flash-attn on this machine: pip install flash-attn --no-build-isolation
      #  - dataset_repo_id MUST be set: lerobot's factory injects dataset stats
      #    into the groot processor at load time; without them normalization
      #    is broken (the node warns and refuses silently-wrong behaviour).
      repo_id: "k-valentin/sobit_home_pickup_block_left_abs_groot"
      policy_class: "lerobot.policies.groot.modeling_groot.GrootPolicy"
      device: "cuda"
      use_amp: false
      use_relative_actions: false
      default_task_label: "Pick up the block"
      dataset_repo_id: "k-valentin/sobit_home-pickup_the_block-left-abs-gazebo"

    runtime:
      # Must match dataset fps (10).
      control_hz: 10.0
      actions_per_chunk: 50
      # GR00T flow-matching inference on a 12 GB GPU: expect a few hundred ms.
      # 0.5 leaves margin; raise toward 0.7 if measured latency is low.
      chunk_size_threshold: 0.5
      aggregate_fn_name: newest
      async_enabled: true
      single_step_mode: false
      # NOTE: joint rate limiting is configured per group via
      # robot.groups.<group>.max_joint_delta (rad): commands are clamped to
      # measured_position +- max_joint_delta each cycle.

    rtc:
      # GrootConfig has no rtc_config — the node auto-disables RTC.
      enabled: false
      execution_horizon: 16
      max_guidance_weight: 10.0
      prefix_attention_schedule: EXP
      inference_delay: 5
      debug: false

    robot:
      name: sobit_home
      joint_states_topic: "/sobit_home/joint_states"
      # odom_topic: base velocities are appended to observation.state at inference time
      # to match the dataset where cmd_vel dims are included in the state vector.
      odom_topic: "/sobit_home/odom"
      groups:
        names:
          - head
          - body
          - left_arm
          # - right_arm
          - left_hand
          # - right_hand
        head:
          command_topic: "/sobit_home/head_position_controller/joint_trajectory"
          # Max command offset from measured position (rad). At 10 Hz this
          # bounds effective speed to ~0.10 × 10 = 1.0 rad/s.
          max_joint_delta: 0.10
          joints_ros:
            - head_pan_joint
            - head_tilt_joint
          features:
            - head_pan_joint
            - head_tilt_joint
        body:
          command_topic: "/sobit_home/body_position_controller/joint_trajectory"
          # body_lift barely moves in the dataset (~0.008 rad span) — keep it slow.
          max_joint_delta: 0.02
          joints_ros:
            - body_lift_joint
          features:
            - body_lift_joint
        left_arm:
          command_topic: "/sobit_home/arm_left_position_controller/joint_trajectory"
          # Max offset from measured position: ~1.5 rad/s effective at 10 Hz —
          # above normal task speed, below chunk-boundary jump magnitude.
          max_joint_delta: 0.15
          joints_ros:
            - arm_left_shoulder_tilt_joint
            - arm_left_upper_roll_joint
            - arm_left_upper_flex_joint
            - arm_left_elbow_joint
            - arm_left_wrist_tilt_joint
            - arm_left_wrist_roll_joint
          features:
            - arm_left_shoulder_tilt_joint
            - arm_left_upper_roll_joint
            - arm_left_upper_flex_joint
            - arm_left_elbow_joint
            - arm_left_wrist_tilt_joint
            - arm_left_wrist_roll_joint
        right_arm:
          command_topic: "/sobit_home/arm_right_position_controller/joint_trajectory"
          joints_ros:
            - arm_right_shoulder_tilt_joint
            - arm_right_upper_roll_joint
            - arm_right_upper_flex_joint
            - arm_right_elbow_joint
            - arm_right_wrist_tilt_joint
            - arm_right_wrist_roll_joint
          features:
            - arm_right_shoulder_tilt_joint
            - arm_right_upper_roll_joint
            - arm_right_upper_flex_joint
            - arm_right_elbow_joint
            - arm_right_wrist_tilt_joint
            - arm_right_wrist_roll_joint
        left_hand:
          command_topic: "/sobit_home/hand_left_position_controller/joint_trajectory"
          # Fingers close quickly during grasp — allow faster steps. When the
          # fingers stall on the block, commands stay <= 0.30 rad beyond the
          # measured position, which still maintains grip force.
          max_joint_delta: 0.30
          joints_ros:
            - hand_left_finger_l_mcp_joint
            - hand_left_finger_l_pip_joint
            - hand_left_finger_l_dip_joint
            - hand_left_finger_c_mcp_joint
            - hand_left_finger_c_ip_joint
            - hand_left_finger_r_pip_joint
            - hand_left_finger_r_dip_joint
          features:
            - hand_left_finger_l_mcp_joint
            - hand_left_finger_l_pip_joint
            - hand_left_finger_l_dip_joint
            - hand_left_finger_c_mcp_joint
            - hand_left_finger_c_ip_joint
            - hand_left_finger_r_pip_joint
            - hand_left_finger_r_dip_joint
        right_hand:
          command_topic: "/sobit_home/hand_right_position_controller/joint_trajectory"
          joints_ros:
            - hand_right_finger_l_mcp_joint
            - hand_right_finger_l_pip_joint
            - hand_right_finger_l_dip_joint
            - hand_right_finger_c_mcp_joint
            - hand_right_finger_c_ip_joint
            - hand_right_finger_r_pip_joint
            - hand_right_finger_r_dip_joint
          features:
            - hand_right_finger_l_mcp_joint
            - hand_right_finger_l_pip_joint
            - hand_right_finger_l_dip_joint
            - hand_right_finger_c_mcp_joint
            - hand_right_finger_c_ip_joint
            - hand_right_finger_r_pip_joint
            - hand_right_finger_r_dip_joint
      mobile_base:
        command_topic: "/sobit_home/cmd_vel"
        features:
          - x.vel
          - y.vel
          - theta.vel
      cameras:
        # Camera names must match the dataset feature keys exactly:
        # observation.images.head_camera / hand_left_camera
        # hand_right_camera excluded — not in the left-arm dataset.
        names:
          - head_camera
          - hand_left_camera
          # - hand_right_camera
        default_encoding: rgb8
        # Dataset collected from compressed topics — subscribe to CompressedImage.
        default_compressed: true
        head_camera:
          topic: "/sobit_home/head_camera/color/image_raw/compressed"
          compressed: true
        hand_left_camera:
          topic: "/sobit_home/hand_left_camera/color/image_raw/compressed"
          compressed: true
        hand_right_camera:
          topic: "/sobit_home/hand_right_camera/color/image_raw/compressed"
          compressed: true

    gamepad:
      topic: "/sobit_home/joy"
      name: quest
      controllers:
        - quest
        - dualshock4
      quest:
        button_mapping:
          play: 4
          stop: 5
      dualshock4:
        button_mapping:
          play: 7
          stop: 6
