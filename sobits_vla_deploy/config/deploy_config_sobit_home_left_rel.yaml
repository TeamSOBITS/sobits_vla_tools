/**:
  ros__parameters:
    model:
      # RELATIVE-actions model (HF docs flow): trained on
      # left-abs-relstats-gazebo with use_relative_actions: true. The pushed
      # preprocessor delta_actions_processor and postprocessor
      # absolute_actions_processor are both ENABLED — the node re-anchors each
      # predicted chunk to the state observed at inference time.
      repo_id: "k-valentin/sobit_home_pickup_block_left_rel_pi05"
      policy_class: "lerobot.policies.pi05.modeling_pi05.PI05Policy"
      device: "cuda"
      use_amp: false
      use_relative_actions: true
      default_task_label: "Pick up the block"
      dataset_repo_id: ""

    runtime:
      # Must match dataset fps (10).
      control_hz: 10.0
      actions_per_chunk: 50
      chunk_size_threshold: 0.5
      # Non-RTC chunk handling: newest = clean replacement at overlaps.
      aggregate_fn_name: newest
      async_enabled: true
      single_step_mode: false
      # NOTE: joint rate limiting is configured per group via
      # robot.groups.<group>.max_joint_delta (rad): commands are clamped to
      # measured_position +- max_joint_delta each cycle.

    rtc:
      # DISABLED for relative mode: RTC guidance compares chunks in model
      # space, but relative chunks are anchored to DIFFERENT reference states
      # (the robot moves between inferences) — the guided prefix double-counts
      # progress after re-anchoring. Evaluate rel without RTC first; a
      # reference-shift correction can be implemented if rel + RTC is wanted.
      enabled: false
      execution_horizon: 16
      max_guidance_weight: 10.0
      prefix_attention_schedule: EXP
      inference_delay: 5
      debug: false

    robot:
      # Morphology (joint groups, command topics, joints, max_joint_delta,
      # mobile_base, cameras) is loaded from the shared robot descriptor:
      #   sobits_vla_common/robots/sobit_home.robot.yaml
      # active_groups / active_cameras / active_mobile_base select the subset
      # used for this task (left-arm pickup) without re-listing joints/topics.
      descriptor_id: sobit_home
      active_groups:
        - head
        - body
        - arm_left
        - hand_left
      active_cameras:
        - head_camera
        - hand_left_camera
      active_mobile_base: true
