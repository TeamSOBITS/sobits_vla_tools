/**:
  ros__parameters:
    # If left empty (""), it defaults to the `rosbags` folder of `sobits_vla_rosbag_collection`.
    rosbag_directory: ""

    # HuggingFace repository ID for the output dataset (e.g. "my-org/my-dataset").
    dataset_name: "MyDataset"

    # The dataset is written to <output_directory>/<dataset_name>.
    # Empty = <package_src>/lerobotdataset/<dataset_name>
    output_directory: ""

    # Target frame rate for the dataset. Frames from the primary camera that arrive
    # faster than this rate are downsampled (dropped) to match.
    fps: 10

    # Video codec used by LeRobotDataset writer. Use "auto" for portable defaults.
    vcodec: "auto"

    # Maximum acceptable temporal gap (seconds) between sensor readings in a single frame.
    # Frames exceeding this threshold are flagged in the logs.
    sync_threshold: 0.1

    # Tolerance margin (seconds) to accept frames arriving slightly early due to scheduling jitter.
    downsample_tolerance: 0.015

    # If true, push the finalized dataset to HuggingFace Hub using `dataset_name` as the repo ID.
    # Requires HF credentials (run: huggingface-cli login).
    push_to_hub: false

    # Deletes the existing output dataset directory first; useful after a failed run.
    overwrite: false

    # Only relevant when push_to_hub is true.
    hub_private: false

    # Skip frames where no joint is moving (all velocities below this); trims
    # idle segments from the dataset. 0.0 = disabled.
    skip_static_threshold: 0.0

    # Robot morphology, joints, EE frames, and cameras all come from this
    # descriptor, loaded from sobits_vla_common/robots/<id>.robot.yaml.
    robot_descriptor_id: "sobit_home"

    # Trim the shared descriptor to the subset this dataset uses, leaving the
    # descriptor itself describing the whole robot. Names must exist in it;
    # unknown names raise an error. Omit or leave empty to use everything.
    # EE poses are emitted when any survives here, skipped when all are
    # excluded; exclude every camera for a state/action-only dataset.
    exclude:
      groups: []
      cameras: []
      ee_poses: []

    # `primary` - sync trigger camera; a new frame is assembled each time an
    #             image arrives from it. Empty = first active camera in the
    #             descriptor. Names and compression come from the descriptor.
    cameras:
      primary: ""
