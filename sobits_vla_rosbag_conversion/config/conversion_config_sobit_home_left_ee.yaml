/**:
  ros__parameters:
    # Empty = defaults to sobits_vla_rosbag_collection/rosbags/, which now also
    # holds the pnp_real_tea_trash_2 bind-mount, so point at it explicitly.
    rosbag_directory: "/home/rg-station-04-keith/colcon_ws/src/sobits_vla_tools/sobits_vla_rosbag_collection/rosbags/pnp_real_tea_trash_2"

    # The 111-episode meta. Set explicitly because rosbag_directory is searched
    # recursively and the 11 session subdirs still hold their own metas, which
    # would add their episodes on top.
    recorded_bags_meta_file: "/home/rg-station-04-keith/colcon_ws/src/sobits_vla_tools/sobits_vla_rosbag_collection/rosbags/pnp_real_tea_trash_2/recorded_bags_meta.yaml"

    # HuggingFace repo ID for the output dataset.
    dataset_name: "team-sobits/sobit_home_left_real-pnp_tea_trash_2-ee-abs"

    # The dataset is written to <output_directory>/<dataset_name>.
    # Empty = <package_src>/lerobotdataset/<dataset_name>
    output_directory: ""

    fps: 10

    # Video codec used by LeRobotDataset writer. Use "auto" for portable defaults.
    vcodec: "auto"

    # Max allowed temporal gap (seconds) between sensor readings per frame.
    sync_threshold: 0.1

    # Tolerance margin (seconds) to accept frames arriving slightly early due to scheduling jitter.
    downsample_tolerance: 0.015

    push_to_hub: true
    hub_private: false
    overwrite: true

    use_relative_actions: false

    # Skip frames where no joint exceeds this velocity (rad/s). 0.0 = disabled.
    skip_static_threshold: 0.0

    # Robot morphology, joints, EE frames, and cameras all come from this descriptor.
    robot_descriptor_id: sobit_home

    # Left arm's joints are superseded by ee_actions below (arm_left is the
    # ee_control-claimed group); right side stays excluded as in the joint config.
    exclude:
      groups: ["arm_left", "arm_right", "hand_right"]
      cameras: ["hand_right_camera"]
      ee: ["right"]

    # EE poses follow exclude.ee above: emitted when any frame survives,
    # skipped when all are excluded. Exclude every name to drop them entirely.

    # Synthesize absolute EE pose actions from offline TF for the left arm,
    # replacing its joint-space action/state with ee.left.* (see ee_control
    # in the robot descriptor for the servo-bridge frame this corresponds to).
    ee_actions:
      enabled: true
      arms: ["left"]

    # primary = sync trigger camera (one frame assembled per primary image;
    # other cameras are sampled at the nearest timestamp).
    cameras:
      primary: "head_camera"
