/**:
  ros__parameters:
    # Directory where the rosbags are stored.
    # Empty = defaults to sobits_vla_rosbag_collection/rosbags/
    rosbag_directory: ""

    # HuggingFace repo ID for the output dataset.
    dataset_name: "MyDataset"

    # Local directory where the LeRobot dataset is written.
    # Empty = ~/.cache/huggingface/lerobot/<dataset_name>
    output_directory: ""

    # Target fps for the LeRobot dataset.
    fps: 10

    # Video codec used by LeRobotDataset writer. Use "auto" for portable defaults.
    vcodec: "auto"

    # Max allowed temporal gap (seconds) between sensor readings per frame.
    sync_threshold: 0.1

    push_to_hub: true
    hub_private: true
    overwrite: false

    # Skip frames where no joint exceeds this velocity (rad/s). 0.0 = disabled.
    skip_static_threshold: 0.0

    # End-effector pose via TF tree.
    ee_pose:
      enabled: false
      target_frame: "base_link"
      source_frame: "hand_palm_link"

    # Camera configuration for sobit_home.
    # primary = sync trigger camera (one frame assembled per primary image).
    # names must match sensor names in recorded_bags_meta.yaml.
    # compressed: use compressed_topics instead of raw topics.
    cameras:
      skip: false
      primary: "head_camera"
      names: ["head_camera", "hand_left_camera", "hand_right_camera"]
      compressed: [true, true, true]
