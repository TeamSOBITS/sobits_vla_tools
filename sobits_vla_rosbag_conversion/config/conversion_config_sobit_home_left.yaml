/**:
  ros__parameters:
    # Directory where the rosbags are stored.
    # Empty = defaults to sobits_vla_rosbag_collection/rosbags/
    rosbag_directory: ""

    # HuggingFace repo ID for the output dataset.
    dataset_name: "MyDataset"

    # Local directory where the LeRobot dataset is written.
    # The dataset is written to <output_directory>/<dataset_name>.
    # Empty = <package_src>/lerobotdataset/<dataset_name>
    output_directory: ""

    # Target fps for the LeRobot dataset.
    fps: 10

    # Video codec used by LeRobotDataset writer. Use "auto" for portable defaults.
    vcodec: "auto"

    # Max allowed temporal gap (seconds) between sensor readings per frame.
    sync_threshold: 0.1

    # Tolerance margin (seconds) to accept frames arriving slightly early due to scheduling jitter.
    downsample_tolerance: 0.015

    push_to_hub: true
    hub_private: false
    overwrite: true

    use_relative_actions: false

    # Skip frames where no joint exceeds this velocity (rad/s). 0.0 = disabled.
    skip_static_threshold: 0.0

    # Mimic joints and unused arm/hand joints to exclude from action/state features.
    # Right arm and right hand are excluded: only left arm is used for pick-up task.
    excluded_joints:
      # Mimic joints (no independent signal)
      - hand_left_finger_r_mcp_joint
      - hand_right_finger_r_mcp_joint
      # Right arm (6 DOF)
      - arm_right_shoulder_tilt_joint
      - arm_right_upper_roll_joint
      - arm_right_upper_flex_joint
      - arm_right_elbow_joint
      - arm_right_wrist_tilt_joint
      - arm_right_wrist_roll_joint
      # Right hand (8 DOF, including the mimic above)
      - hand_right_finger_l_mcp_joint
      - hand_right_finger_l_pip_joint
      - hand_right_finger_l_dip_joint
      - hand_right_finger_c_mcp_joint
      - hand_right_finger_c_ip_joint
      - hand_right_finger_r_pip_joint
      - hand_right_finger_r_dip_joint

    # End-effector pose via TF tree.
    ee_pose:
      enabled: false
      names: ["left"]
      source_frames: ["hand_left_end_effector_link"]
      target_frames: ["base_link"]

    # Camera configuration for sobit_home.
    # primary = sync trigger camera (one frame assembled per primary image).
    # names must match sensor names in recorded_bags_meta.yaml.
    # compressed: use compressed_topics instead of raw topics.
    cameras:
      skip: false
      primary: "head_camera"
      names: ["head_camera", "hand_left_camera"]
      compressed: [true, true]
