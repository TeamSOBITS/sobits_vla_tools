/**:
  ros__parameters:
    # Directory where the rosbags are stored
    # If left empty (""), it defaults to the `rosbags` folder of `sobits_vla_rosbag_collection`.
    rosbag_directory: ""

    # HuggingFace repository ID for the output dataset (e.g. "my-org/my-dataset").
    dataset_name: "MyDataset"

    # Local directory where the dataset is saved.
    # If left empty (""), defaults to ~/.cache/huggingface/lerobot/<dataset_name>
    # (or $HF_LEROBOT_HOME/<dataset_name> if that env var is set).
    output_directory: ""

    # Target frame rate for the dataset. Frames from the primary camera that arrive
    # faster than this rate are downsampled (dropped) to match.
    fps: 10

    # Maximum acceptable temporal gap (seconds) between sensor readings in a single frame.
    # Frames exceeding this threshold are flagged in the logs.
    sync_threshold: 0.1

    # If true, push the finalized dataset to HuggingFace Hub using `dataset_name` as the repo ID.
    # Requires HF credentials (run: huggingface-cli login).
    push_to_hub: false

    # If true, the HuggingFace Hub repository will be created as private.
    # Only relevant when push_to_hub is true.
    hub_private: false

    # Cameras to include in the dataset conversion.
    # `skip`       - if true, omit all camera image features; produces a state/action-only dataset.
    #                Dramatically faster for quick prototyping or debugging without video encoding.
    # `primary`    - sync trigger camera; a new frame is assembled each time an image arrives from it.
    #                Must match one of the names listed in `names` below.
    # `names`      - camera names as declared in recorded_bags_meta.yaml sensors section.
    #                If empty, all cameras found in metadata are included.
    # `compressed` - one bool per entry in `names`; true = use compressed_topics, false = use raw topics.
    #                Entries beyond the length of `names` are ignored; missing entries default to false.
    # Skip frames where no joint is moving (all velocities below threshold).
    # Useful for removing idle segments from the dataset.
    # Set threshold to 0.0 to disable.
    skip_static_threshold: 0.0

    # End-effector pose observation via TF tree.
    # Computes 6D pose (x, y, z, roll, pitch, yaw) from the TF chain.
    # `enabled`      - if true, include EE pose as an observation feature.
    # `target_frame` - reference frame (usually the robot base).
    # `source_frame` - end-effector frame (e.g. "hand_palm_link").
    # Both frames must exist in /tf or /tf_static recorded in the bag.
    ee_pose:
      enabled: false
      target_frame: "base_link"
      source_frame: "hand_palm_link"

    cameras:
      skip: false
      primary: "head_camera"
      names: ["head_camera", "hand_camera"]
      compressed: [false, false]
