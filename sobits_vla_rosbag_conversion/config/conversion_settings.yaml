/**:
  ros__parameters:
    # Directory where the rosbags are stored
    # If left empty (""), it defaults to the `rosbags` folder of `sobits_vla_rosbag_collection`.
    rosbag_directory: ""

    # HuggingFace repository ID or local dataset directory name
    dataset_name: "MyDataset"

    # Primary camera to use as the synchronization trigger for frame assembly.
    # Must match one of the camera names defined in the `rgb_cam.names` list of `recorded_bags_meta.yaml`.
    # The script will snapshot a frame every time a new image arrives from this camera.
    # Typically this should be the most important visual feed (e.g., the head or wrist camera).
    primary_camera: "head_camera"
