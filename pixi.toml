# pixi manifest for sobits_vla_tools — Python dependencies ONLY.
# =============================================================================
# ROS (ros-jazzy-*, rclpy, message packages, ament_*) comes from apt + rosdep,
# never pixi — see install.sh. pixi gives each package its own env (plus a
# cpu/gpu torch variant) so node groups can hold conflicting numpy/torch/lerobot
# versions and still talk over DDS: reproducible via pixi.lock, no global pip.
# [activation] sources /opt/ros/$ROS_DISTRO so rclpy imports inside every env.
#
#   pixi run -e training-gpu ros2 run sobits_vla_training train_node
#   pixi run -e deploy-cpu   ros2 run sobits_vla_deploy   sobits_vla_deploy
# =============================================================================

[workspace]
name = "sobits_vla_tools"
channels = ["conda-forge", "pytorch"]
platforms = ["linux-64"]

# -----------------------------------------------------------------------------
# Shared base: pinned to the ROS interpreter. Present in EVERY environment.
# -----------------------------------------------------------------------------
[dependencies]
python = "3.12.*"          # MUST match ros-jazzy rclpy (CPython 3.12)
pip = "*"
# Held inside lerobot 0.6.0's caps so the conda solve satisfies the pip solve —
# conda pulls newer otherwise and pip fails with "pinned by conda solve".
setuptools = ">=71.0.0,<81.0.0"
packaging = ">=24.2,<26.0"
cmake = ">=3.29.0.1,<4.2.0"
libstdcxx-ng = ">=13"      # avoid GLIBCXX skew vs system ROS libs
pyyaml = "*"               # rclpy imports yaml -> base, else viz/collection fail

[activation]
# Bridges apt ROS into the env. Export ROS_DISTRO before `pixi run`.
scripts = ["scripts/pixi_ros_bridge.sh"]

# =============================================================================
# ACCELERATOR — torch/torchvision from PyPI (not conda), pinned to lerobot
# 0.6.0's range, cpu vs cu128 wheel index per feature. Matches lerobot's own
# [tool.uv.sources] and avoids the conda-torch vs pip-torch ABI clash.
# =============================================================================
[feature.cpu.pypi-dependencies]
torch = { version = ">=2.7,<2.12.0", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.22.0,<0.27.0", index = "https://download.pytorch.org/whl/cpu" }

[feature.gpu]
platforms = ["linux-64"]

[feature.gpu.pypi-dependencies]
torch = { version = ">=2.7,<2.12.0", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.22.0,<0.27.0", index = "https://download.pytorch.org/whl/cu128" }

# =============================================================================
# HEAVY ML STACK — lerobot + friends for common/deploy/training/conversion,
# torch-free (torch comes from cpu|gpu). lerobot's fast-moving pins (transformers,
# hf-hub, accelerate ...) are left to pip, whose extras pull exact versions;
# conda owns only numpy and the native libs those wheels expect. Extras map to
# the policies imported: pi -> pi0/pi05/pi0_fast, vla_jepa, smolvla,
# training -> dataset+wandb+accelerate, peft-dep -> LoRA.
# =============================================================================
[feature.mlstack.dependencies]
numpy = ">=2.0.0,<2.3.0"   # ABI anchor for pandas/scipy/opencv; matches lerobot
# torchcodec (pip, via lerobot's "dataset" extra) ships libtorchcodec_core{4..8}.so
# but no FFmpeg — without this every video decode dies in the DataLoader worker.
ffmpeg = ">=7.1,<9"        # <9 keeps sonames matching a shipped core*.so
# Do NOT add ros-jazzy-cv-bridge: its NumPy-1.x C extension segfaults under
# NumPy 2, and the robostack fix drags in a SECOND full ROS stack (108 pkgs) that
# rebinds apt rclpy. _on_image() in sobits_vla_deploy.py decodes via cv2 instead.
pytest = ">=7"             # lerobot seam tests (sobits_vla_common) run in these envs

[feature.mlstack.pypi-dependencies]
lerobot = { version = "~=0.6.0", extras = ["training", "transformers-dep", "pi", "smolvla", "peft-dep", "vla_jepa"] }

# =============================================================================
# PER-PACKAGE FEATURES — only what each package needs beyond base + mlstack.
# =============================================================================

# sobits_vla_common — fully covered by mlstack + accelerator.
[feature.common.dependencies]

# sobits_vla_deploy — scipy + PIL already arrive through lerobot; conda pins
# here would fight the pip versions.
[feature.deploy.dependencies]

# sobits_vla_training — accelerate/peft/hf_hub come from the lerobot extras.
[feature.training.dependencies]

# sobits_vla_rosbag_conversion — pandas/scipy/pyarrow/pillow arrive via lerobot;
# only what it does NOT pull is declared here (rosbags is pip-only).
[feature.conversion.dependencies]
matplotlib = "*"
numexpr = ">=2.10.2"
bottleneck = ">=1.4.2"
[feature.conversion.pypi-dependencies]
rosbags = "*"

# sobits_vla_visualization — LIGHT: no torch, no lerobot -> its own slim env.
[feature.viz.dependencies]
numpy = ">=2.0.0,<2.3.0"
pandas = ">=2.2.2,<2.4"
matplotlib = "*"

# =============================================================================
# ENVIRONMENTS — one per package; ML packages get a -cpu and a -gpu variant.
# `solve-group` keeps same-accelerator envs on one solve, still separate installs.
# =============================================================================
[environments]
viz = { features = ["viz"] }        # visualization: slim, no torch
collection = { features = [] }      # rosbag_collection: C++/launch, no python deps

# ML packages × {cpu, gpu}
common-cpu     = { features = ["common", "mlstack", "cpu"], solve-group = "cpu" }
common-gpu     = { features = ["common", "mlstack", "gpu"], solve-group = "gpu" }
deploy-cpu     = { features = ["deploy", "mlstack", "cpu"], solve-group = "cpu" }
deploy-gpu     = { features = ["deploy", "mlstack", "gpu"], solve-group = "gpu" }
training-cpu   = { features = ["training", "mlstack", "cpu"], solve-group = "cpu" }
training-gpu   = { features = ["training", "mlstack", "gpu"], solve-group = "gpu" }
conversion-cpu = { features = ["conversion", "mlstack", "cpu"], solve-group = "cpu" }
conversion-gpu = { features = ["conversion", "mlstack", "gpu"], solve-group = "gpu" }
