/**:
  ros__parameters:
    # =========================================================================
    # Policy selection
    # =========================================================================
    # One of: smolvla | pi0 | pi05 | pi0_fast
    # The corresponding config/policies/<policy>.yaml is loaded automatically.
    policy: smolvla

    # =========================================================================
    # Dataset
    # =========================================================================
    dataset:
      # HuggingFace Hub repo_id or absolute local path to a LeRobotDataset.
      repo_id: ""
      # Number of parallel DataLoader workers (0 = main thread only).
      num_workers: 4
      # Optional feature rename map: {"old_key": "new_key"}.
      # Useful when dataset keys differ from policy expectations.
      rename_map: []

    # =========================================================================
    # Checkpoint / resume
    # =========================================================================
    checkpoint:
      # Directory where checkpoints and final model are saved.
      output_dir: ""
      # Resume from the last checkpoint inside output_dir (true) or start fresh (false).
      resume: false
      # Set to true to delete output_dir before training (ignored when resume is true).
      overwrite: false
      # Path or HuggingFace repo_id to initialise weights from before training.
      # Overrides policy_config.pretrained_path when non-empty.
      # Accepts: "" | "/abs/local/path" | "hf-user/repo-name"
      pretrained_path: ""
      # Save a checkpoint every N steps.
      save_freq: 20000
      # Whether to save checkpoints at all.
      save_checkpoint: true

    # =========================================================================
    # Training loop
    # =========================================================================
    training:
      # Total number of gradient update steps.
      steps: 100000
      # Batch size per GPU.
      batch_size: 32
      # Random seed for reproducibility.
      seed: 1000
      # Use policy config's built-in optimizer / scheduler presets (recommended: true).
      # Set false to override with training.optimizer / training.scheduler below.
      use_policy_training_preset: true
      # Log metrics every N steps.
      log_freq: 200
      # Run validation every N steps (0 = disable).
      eval_freq: 20000

    # =========================================================================
    # Multi-GPU
    # =========================================================================
    # Number of GPUs to use. 1 = single GPU, 0 = CPU (debug only).
    # Values > 1 require torch.distributed / accelerate to be available.
    num_gpus: 1

    # =========================================================================
    # Weights & Biases logging
    # =========================================================================
    wandb:
      # Enable W&B run logging.
      enable: true
      # W&B project name.
      project: "sobits_vla_training"
      # W&B entity (team or user). Leave empty to use default from wandb login.
      entity: ""
      # W&B run name. Auto-generated from policy + timestamp when empty.
      run_name: ""
      # Tags attached to the run.
      tags: []
      # Notes attached to the run.
      notes: ""

    # =========================================================================
    # HuggingFace Hub push
    # =========================================================================
    hub:
      # Push the FINAL-step model to HF Hub after training (no best-checkpoint selection).
      push_to_hub: true
      # Target repo on HF Hub (e.g. "team-sobits/sobit_home_smolvla").
      repo_id: ""
      # Make the Hub repo private.
      private: false


    # =========================================================================
    # Policy-specific overrides
    # =========================================================================
    # Any field listed here takes precedence over the loaded policy YAML.
    # Example: set chunk_size to 100 for smolvla without editing smolvla.yaml.
    #
    # policy_overrides:
    #   chunk_size: 100
    #   freeze_vision_encoder: false
    policy_overrides: []
