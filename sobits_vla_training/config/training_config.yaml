/**:
  ros__parameters:
    # =========================================================================
    # Policy selection — one of: smolvla | pi0 | pi05 | pi0_fast
    # The matching config/policies/<policy>.yaml is loaded automatically.
    # =========================================================================
    policy: smolvla

    # =========================================================================
    # Dataset
    # =========================================================================
    dataset:
      # HuggingFace Hub repo_id or absolute local path to a LeRobotDataset.
      repo_id: ""
      # Parallel DataLoader workers (0 = main thread only).
      num_workers: 12
      # Feature rename map {"old_key": "new_key"}, for when dataset keys
      # differ from what the policy expects.
      rename_map: []
      # Fraction of episodes per task held out for eval (0.0 = off).
      eval_split: 0.0

    # =========================================================================
    # Checkpoint / resume
    # =========================================================================
    checkpoint:
      # Checkpoint dir: relative -> lerobotmodel/<path>, absolute -> verbatim.
      # Empty -> lerobotmodel/<hub.repo_id>, i.e. organization/model_name.
      output_dir: ""
      # Continue from the last checkpoint inside output_dir.
      resume: false
      # Delete output_dir before training (ignored when resume is true).
      overwrite: false
      # Init weights from "" | "/abs/local/path" | "hf-user/repo-name".
      # Overrides policy_config.pretrained_path when non-empty.
      pretrained_path: ""
      save_freq: 20000
      save_checkpoint: true

    # =========================================================================
    # Training loop
    # =========================================================================
    training:
      steps: 100000
      # Per GPU — lerobot has no gradient accumulation.
      batch_size: 32
      seed: 1000
      # Use the policy's built-in optimizer/scheduler presets (recommended).
      # Forced false when optimizer_type below is non-empty.
      use_policy_training_preset: true
      log_freq: 200
      # Validation interval; 0 disables.
      eval_freq: 20000
      # Set "sgd" to bypass the policy preset with the SGDConfig below.
      optimizer_type: ""
      optimizer_sgd:
        lr: 0.001
        momentum: 0.0
        dampening: 0.0
        nesterov: false
        weight_decay: 0.0
        grad_clip_norm: 10.0
      # Warmup for the constant-with-warmup scheduler paired with optimizer_type.
      scheduler_warmup_steps_override: 1000

    # =========================================================================
    # Multi-GPU — 1 = single GPU, 0 = CPU (debug only).
    # Values > 1 require torch.distributed / accelerate.
    # =========================================================================
    num_gpus: 1

    # =========================================================================
    # Weights & Biases — lerobot auto-tags runs from the config
    # (policy/dataset/seed), so there is no manual tags key.
    # =========================================================================
    wandb:
      enable: true
      project: "sobits_vla_training"
      # Team or user; empty uses the default from `wandb login`.
      entity: ""
      # Display name; auto-generated from policy + timestamp when empty.
      run_name: ""
      notes: ""

    # =========================================================================
    # HuggingFace Hub push
    # =========================================================================
    hub:
      # Pushes the FINAL-step model — no best-checkpoint selection.
      push_to_hub: true
      # e.g. "team-sobits/sobit_home_smolvla".
      repo_id: ""
      private: false
      # Also push every saved checkpoint; requires repo_id.
      save_checkpoints: false


    # =========================================================================
    # Policy-specific overrides — take precedence over the loaded policy YAML,
    # e.g. set chunk_size for smolvla without editing smolvla.yaml:
    #   policy_overrides:
    #     chunk_size: 100
    #     freeze_vision_encoder: false
    # =========================================================================
    policy_overrides: []
