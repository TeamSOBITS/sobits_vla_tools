/**:
  ros__parameters:
    # =========================================================================
    # sobits_vla_training — SOBIT HOME "pickup_the_block" (Gazebo, left arm) — SmolVLA
    #
    # Launch  : ros2 launch sobits_vla_training sobits_vla_training.launch.py robot:=sobit_home_left_smolvla
    # Dataset : k-valentin/sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)
    # Policy  : SmolVLA (450M — lightweight; SmolVLM2 backbone + action expert)
    # Base    : lerobot/smolvla_base
    # Recipe  : per HF smolvla docs — FULL fine-tune (no LoRA: the model is
    #           small enough), ~20k steps, large batch, policy preset
    #           (lr 1e-4, grad_clip 10). Docs note >= 50 episodes with several
    #           repetitions per task variation; our 202 episodes qualify.
    # NOTE    : smolvla has no gradient_checkpointing field; batch is sized
    #           for 32 GB without it (~0.5 GB activations/sample).
    # =========================================================================

    policy: smolvla

    dataset:
      repo_id: "k-valentin/sobit_home-pickup_the_block-left-abs-gazebo"
      num_workers: 4
      rename_map: []

    checkpoint:
      output_dir: "sobit_home_pickup_block_smolvla"
      resume: false
      overwrite: true
      pretrained_path: "lerobot/smolvla_base"
      save_freq: 5000
      save_checkpoint: true

    training:
      # 30k steps to match the pi05 VLM-LoRA run for fair comparison.
      steps: 30000
      # Unfreezing the VLM increases activation memory; drop from 32 to 16
      # to stay safely within 32 GB (~12 GB backbone + 16 x 0.5 GB ≈ 20 GB).
      batch_size: 16
      seed: 1000
      # SmolVLA preset: AdamW lr=1e-4, weight_decay=1e-10, grad_clip=10.
      use_policy_training_preset: true
      log_freq: 100
      eval_freq: 5000

    num_gpus: 1

    wandb:
      enable: true
      project: "sobits_vla_training"
      entity: ""
      run_name: "sobit_home-pickup_block-left-abs-smolvla-vlmft"
      notes: "SmolVLA full fine-tune (VLM unfrozen) on sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions, left arm only)"
      tags:
        - smolvla
        - sobit_home
        - pickup_block
        - gazebo

    hub:
      push_to_hub: true
      repo_id: "k-valentin/sobit_home_pickup_block_left_abs_smolvla_vlmft"
      private: false

    peft:
      # Full fine-tune — no LoRA needed for the 450M SmolVLA.
      method_type: ""

    policy_overrides:
      max_state_dim: 32
      max_action_dim: 32
      chunk_size: 50
      n_action_steps: 50
      # Unfreeze VLM vision encoder — LeKiwi finding: helps when base-motion
      # demos are sparse and the VLM needs to adapt to the robot's visual domain.
      freeze_vision_encoder: false
      # Train VLM + expert together (not expert-only).
      train_expert_only: false
      train_state_proj: true
