# GR00T N1.7 training defaults.
# All fields map 1-to-1 to GrootConfig dataclass fields (lerobot 0.6.0).
#
# VERSION NOTE: lerobot 0.6.0 removed GR00T N1.5 support entirely; only N1.7
# (Cosmos-Reason2-2B backbone, base model nvidia/GR00T-N1.7-3B) is available.
# Existing N1.5 fine-tunes are NOT loadable by lerobot 0.6.0 — a retrain
# against N1.7 is required (see training_config_sobit_home_left_groot.yaml).
# N1.7 drops the Eagle2 VLM tokenizer assets (tokenizer_assets_repo) used by
# N1.5 — GrootConfig now raises if that field is set at all, so it is not
# listed here.
#
# FREEZING: GR00T uses its own tune_* flags (NOT lerobot PEFT, NOT
# freeze_vision_encoder). The default post-training recipe tunes the
# projector + diffusion action head + VL LayerNorm/self-attn on top of the
# frozen backbone.

policy_type: groot

# Weights come from base_model_path below, not from a lerobot checkpoint.
pretrained_path: ""

base_model_path: "nvidia/GR00T-N1.7-3B"

# Custom robots use the new_embodiment tag (Isaac-GR00T convention).
embodiment_tag: "new_embodiment"

# --- Action chunking (N1.7 defaults) ---
chunk_size: 40
n_action_steps: 40
n_obs_steps: 1

# --- Dimension padding (N1.7 pads state and action to 132) ---
max_state_dim: 132
max_action_dim: 132

# --- Fine-tuning scope (GR00T-native flags) ---
tune_llm: false
tune_visual: false
tune_projector: true
tune_diffusion_model: true
tune_vlln: true
tune_top_llm_layers: 0

# --- Optimisation (N1.7 preset) ---
# NOTE: get_scheduler_preset() derives num_warmup_steps from training.steps
# via warmup_ratio (5%) — no fixed step count assumption like N1.5 had.
optimizer_lr: 1.0e-4
optimizer_weight_decay: 1.0e-5
warmup_ratio: 0.05

use_bf16: true
model_params_fp32: true
