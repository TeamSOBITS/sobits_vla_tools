/**:
  ros__parameters:
    # =========================================================================
    # SOBIT HOME "pickup_the_block" (Gazebo, left arm) — PI0 (VLM-LoRA)
    #
    # Launch  : ros2 launch sobits_vla_training sobits_vla_training.launch.py robot:=sobit_home_left_pi0_vlmlora
    # Dataset : team-sobits/sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)
    # Policy  : PI0 (PaliGemma 2B + Gemma 300M action expert, flow matching)
    # Base    : lerobot/pi0_base (per HF pi0 docs)
    # Recipe  : VLM-LoRA — extends the expert-only LoRA of
    #           training_config_sobit_home_left_pi0.yaml to the PaliGemma
    #           language_model attention layers, matching the pi05 VLM-LoRA
    #           scope so the two can be compared (see
    #           docs/PI0_PI05_VS_SMOLVLA_PERFORMANCE_ANALYSIS.md).
    # =========================================================================

    policy: pi0

    robot:
      descriptor_id: sobit_home_frozen
      active_groups:
        - head
        - body
        - arm_left
        - hand_left
      active_cameras:
        - head_camera
        - hand_left_camera
      active_mobile_base: true

    dataset:
      repo_id: "team-sobits/sobit_home-pickup_the_block-left-abs-gazebo"
      num_workers: 12
      rename_map: []

    checkpoint:
      output_dir: ""
      resume: false
      overwrite: true
      pretrained_path: "lerobot/pi0_base"
      save_freq: 5000
      save_checkpoint: true

    training:
      steps: 30000
      # RTX 5090 32 GB: batch 16 requires gradient_checkpointing (see overrides).
      # lerobot has NO gradient accumulation — effective batch = batch_size.
      batch_size: 16
      seed: 1000
      use_policy_training_preset: true
      log_freq: 100
      # No effect without a gym env — kept for parity with the other pi0 configs.
      eval_freq: 5000

    num_gpus: 1

    wandb:
      enable: true
      project: "sobits_vla_training"
      entity: ""
      run_name: "sobit_home-pickup_block-left-abs-pi0-vlmlora"
      notes: "PI0 VLM-LoRA fine-tune on sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions, left arm only, language_model adapters unfrozen)"

    hub:
      push_to_hub: true
      # Distinct repo from the expert-only pi0 LoRA run (different recipe).
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_pi0_vlmlora"
      private: false

    # =========================================================================
    # LoRA / PEFT — VLM-LoRA recipe. pi0 and pi05 share the identical
    # PaliGemmaWithExpertModel tree, so pi05's target regex applies unchanged.
    # =========================================================================
    peft:
      method_type: "LORA"
      # r=16 matches the expert-only pi0/pi05 LoRA runs; alpha/r = 2.0.
      r: 16
      lora_alpha: 32
      # Light dropout against overfitting on the small demo dataset.
      lora_dropout: 0.05
      # Targets: gemma_expert self_attn (q,v)_proj (the pi0 default), plus
      # language_model self_attn (q,v)_proj and the action/time projections.
      target_modules: "(.*\\.gemma_expert\\..*\\.self_attn\\.(q|v)_proj|.*\\.language_model\\..*\\.self_attn\\.(q|v)_proj|model\\.(action_in_proj|action_out_proj|time_mlp_in|time_mlp_out))"
      full_training_modules: []

    policy_overrides:
      chunk_size: 50
      n_action_steps: 50
      dtype: "bfloat16"

      # Signals intent to adapt the VLM. SigLIP has no adapters and stays
      # frozen regardless, so this is documentation more than behaviour.
      freeze_vision_encoder: false

      train_expert_only: false

      # Required at batch 16 on 32 GB; composes with compile (use_reentrant=False).
      gradient_checkpointing: true

      # DISABLED: Triton sm_120 (Blackwell / RTX 5090) crashes compiling the VLM
      # backward when LoRA touches language_model layers (as in pi05 VLM-LoRA).
      compile_model: false

      use_relative_actions: false

      # LoRA LR: ~4x the full-FT preset (2.5e-5) — see the expert-only pi0
      # config for the 4x-vs-10x rationale.
      optimizer_lr: 1.0e-4
      optimizer_weight_decay: 0.01
      scheduler_warmup_steps: 500
      scheduler_decay_steps: 30000
      scheduler_decay_lr: 1.0e-5
