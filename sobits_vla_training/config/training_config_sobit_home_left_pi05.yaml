/**:
  ros__parameters:
    # =========================================================================
    # SOBIT HOME "pickup_the_block" (Gazebo, left arm) — PI0.5
    #
    # Dataset : team-sobits/sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)
    # Policy  : PI0.5 (PaliGemma 2B + Gemma 300M action expert, flow matching)
    # Robot   : left arm only, 2 cameras (head + hand_left), mobile base
    # DOF     : 19 (head×2 + body×1 + arm_left×6 + hand_left×7 + base [x,y,θ])
    # GPU     : 32 GB VRAM — see batch_size/gradient_checkpointing below
    # =========================================================================

    policy: pi05

    robot:
      descriptor_id: sobit_home
      active_groups:
        - head
        - body
        - arm_left
        - hand_left
      active_cameras:
        - head_camera
        - hand_left_camera
      active_mobile_base: true

    # =========================================================================
    # Dataset
    # =========================================================================
    dataset:
      repo_id: "team-sobits/sobit_home-pickup_the_block-left-abs-gazebo"
      # Video decode is the bottleneck at native resolution — keep this high.
      num_workers: 12
      # Dataset keys already match PI0.5 conventions.
      rename_map: []

    # =========================================================================
    # Checkpoint / resume
    # =========================================================================
    checkpoint:
      output_dir: ""
      resume: false
      # Deletes output_dir before training (ignored when resume is true).
      overwrite: true
      # Official PI0.5 base weights; a local path works too.
      pretrained_path: "lerobot/pi05_base"
      save_freq: 5000
      save_checkpoint: true

    # =========================================================================
    # Training loop
    # =========================================================================
    training:
      # ~30k steps ≈ reasonable convergence for a 101-episode task.
      steps: 30000
      # pi05 activations ~1.1 GB/sample and lerobot has NO gradient
      # accumulation, so batch 16 REQUIRES gradient_checkpointing below
      # (~23 GB peak; without it ~29 GB → OOM on this 32 GB card).
      batch_size: 16
      seed: 1000
      # PI0.5 preset: AdamW lr=2.5e-5, weight_decay=0.01.
      use_policy_training_preset: true
      log_freq: 100
      # EFFECTIVELY DISABLED: env_eval_freq only triggers gym-env rollouts,
      # and cfg.env is None for real-robot datasets.
      eval_freq: 5000

    num_gpus: 1

    # =========================================================================
    # Weights & Biases
    # =========================================================================
    wandb:
      enable: true
      project: "sobits_vla_training"
      entity: ""
      run_name: "sobit_home-pickup_block-left-abs-pi05-vlmlora"
      notes: "PI0.5 VLM-LoRA on sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions, left arm, language_model adapters unfrozen)"

    # =========================================================================
    # HuggingFace Hub push — FINAL-step model + processors.
    # =========================================================================
    hub:
      push_to_hub: true
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_pi05_vlmlora"
      private: false

    # =========================================================================
    # LoRA / PEFT — VLM-LoRA recipe: adds adapters to the PaliGemma
    # language_model attention (~3.2M trainable vs ~1.3M with pi05 defaults),
    # letting the VLM adapt to the robot's visual domain without unfreezing it.
    # =========================================================================
    peft:
      method_type: "LORA"
      # r=16 is the recommended start for task adaptation; alpha/r = 2.0.
      r: 16
      lora_alpha: 32
      # Light dropout against overfitting on 101 episodes.
      lora_dropout: 0.05
      # Targets: gemma_expert self_attn (q,v)_proj (the pi05 default), plus
      # language_model self_attn (q,v)_proj and the action/time projections.
      target_modules: "(.*\\.gemma_expert\\..*\\.self_attn\\.(q|v)_proj|.*\\.language_model\\..*\\.self_attn\\.(q|v)_proj|model\\.(action_in_proj|action_out_proj|time_mlp_in|time_mlp_out))"
      full_training_modules: []

    # =========================================================================
    # PI0.5 policy overrides — these win over config/policies/pi05.yaml.
    # =========================================================================
    policy_overrides:

      # --- Action chunking ---
      # 50 @ 10 fps = 5 s per inference call; pi05_base was pretrained at 50.
      chunk_size: 50
      n_action_steps: 50
      n_obs_steps: 1

      # --- Model ---
      paligemma_variant: "gemma_2b"
      action_expert_variant: "gemma_300m"
      dtype: "bfloat16"

      # --- Flow matching ---
      num_inference_steps: 10

      # --- Vision --- (PI0.5 resizes all cameras to 224×224 internally)
      image_resolution:
        - 224
        - 224
      # 2 physical cameras — no empty-camera padding needed.
      empty_cameras: 0

      # Signals intent to adapt the VLM. SigLIP has no adapters and stays
      # frozen regardless, so this is documentation more than behaviour.
      freeze_vision_encoder: false

      # Recomputes activations in backward: ~35% less VRAM, ~25% slower steps.
      # Required at batch 16 here; droppable at batch <= 10 for speed.
      gradient_checkpointing: true

      # No effect under LoRA (the VLM is frozen either way); false matches the
      # trained model's config.
      train_expert_only: false

      # MISLEADING NAME: use_peft means "pretrained_path IS a PEFT adapter
      # repo", not "train with LoRA". false → pi05_base loads as full weights
      # (correct here); true → only to CONTINUE from a previous adapter.
      # LoRA training is switched on by the peft: section above, after which
      # lerobot flips this to true so the Hub push uploads adapter files.
      use_peft: false

      # PI0.5 default.
      tokenizer_max_length: 200

      # --- Relative actions ---
      # Disabled: absolute joint-space for this task. Enabling it ALSO requires
      # recomputing dataset stats in relative space first (lerobot-edit-dataset
      # --operation.type recompute_stats --operation.relative_action true ...),
      # excluding base_x/base_y/base_theta which are VELOCITIES. Training
      # relative actions against absolute-space stats yields a broken policy.
      use_relative_actions: false

      # --- Optimisation ---
      # Used even with use_policy_training_preset: true — the preset getters
      # read these optimizer_*/scheduler_* fields. LoRA LR 1e-4 is 4x the
      # full-FT 2.5e-5; HF PEFT suggests up to 10x, but that risks instability
      # with the larger expert.
      optimizer_lr: 1.0e-4
      optimizer_weight_decay: 0.01
      optimizer_grad_clip_norm: 1.0

      # --- LR schedule --- (keeps the ~1/10 peak-to-final ratio)
      scheduler_warmup_steps: 500
      scheduler_decay_steps: 30000
      scheduler_decay_lr: 1.0e-5

      # DISABLED: Triton sm_120 (Blackwell / RTX 5090) crashes compiling the VLM
      # backward when LoRA adapters touch language_model layers.
      compile_model: false
