/**:
  ros__parameters:
    # =========================================================================
    # SOBIT HOME "pickup_the_block" (Gazebo, left arm) — VLA-JEPA
    #
    # Launch  : ros2 launch sobits_vla_training sobits_vla_training.launch.py robot:=sobit_home_left_vla_jepa
    # Dataset : team-sobits/sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)
    # Policy  : VLA-JEPA (Qwen3-VL-2B + DiT-B flow-matching head + V-JEPA2
    #           latent world model, used at training time only)
    # Base    : lerobot/VLA-JEPA-Pretrain (DROID 1.0.1, 7-dim EE actions)
    # Recipe  : per HF vla_jepa docs — fine-tune from Pretrain, ~30k steps. The
    #           base used 7-dim actions / 8-dim state, so the action-head
    #           projections MUST be re-initialised (reinit_modules below); the
    #           Qwen backbone and DiT trunk keep their pretrained weights.
    # =========================================================================

    policy: vla_jepa

    robot:
      descriptor_id: sobit_home_v1_1
      # exclude trims the shared descriptor to this task's subset.
      # Unknown names raise.
      exclude:
        groups: ["arm_right", "hand_right"]
        cameras: ["hand_right_camera"]
        # Dataset carries no EE-pose features.
        ee_poses: [left, right]
        mobile_base: false

    dataset:
      repo_id: "team-sobits/sobit_home-pickup_the_block-left-abs-gazebo"
      num_workers: 12
      rename_map: []

    checkpoint:
      output_dir: ""
      resume: false
      overwrite: true
      pretrained_path: "lerobot/VLA-JEPA-Pretrain"
      save_freq: 5000
      save_checkpoint: true

    training:
      # 30k steps per the HF LIBERO recipe (matches our pi05/smolvla runs).
      steps: 30000
      # Only the ~200M action head trains, so optimizer state is small and
      # batch is bounded by activations. Raise if nvidia-smi shows headroom.
      batch_size: 16
      seed: 1000
      # VLA-JEPA preset: AdamW lr=1e-4, weight_decay=1e-10, grad_clip=10.
      use_policy_training_preset: true
      log_freq: 100
      eval_freq: 5000

    num_gpus: 1

    wandb:
      enable: true
      project: "sobits_vla_training"
      entity: ""
      run_name: "sobit_home-pickup_block-left-abs-vla_jepa-headft"
      notes: "VLA-JEPA fine-tune from lerobot/VLA-JEPA-Pretrain on sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions, left arm only; reinit action/state projections for 19-dim joints)"

    hub:
      push_to_hub: true
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_vla_jepa"
      private: false

    peft:
      # No lerobot PEFT for VLA-JEPA; scope is controlled via freeze_qwen.
      method_type: ""

    policy_overrides:
      # Paper/DROID chunking: 7 steps (0.7 s at 10 fps). The deploy node
      # re-infers per chunk, so short chunks mean frequent inference.
      chunk_size: 7
      n_action_steps: 7
      # Action-head-only fine-tune (HF docs variant): full FT of the 2.77B
      # model needs ~33 GB for weights+grads+Adam alone and OOMs a 32 GB card.
      # Side effect: the world-model loss auto-disables (no grads reach the
      # backbone). Set false only on >=48 GB or multi-GPU.
      freeze_qwen: true
      # REQUIRED for cross-embodiment fine-tuning: our 19-dim action/state
      # mismatch the pretrained 7/8-dim projections, so these layers are
      # re-initialised. Any other shape mismatch still raises.
      reinit_modules:
        - "model.action_model.action_encoder"
        - "model.action_model.action_decoder"
        - "model.action_model.state_encoder"
