/**:
  ros__parameters:
    # =========================================================================
    # SOBIT HOME "pickup_the_block" (Gazebo, left arm) — ACT
    #
    # Launch  : ros2 launch sobits_vla_training sobits_vla_training.launch.py robot:=sobit_home_left_act
    # Dataset : team-sobits/sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)
    # Policy  : ACT (~80M, ResNet18 + transformer, VAE) — trained FROM SCRATCH
    # Recipe  : per HF act docs — defaults work well; batch 8+, ~100k steps.
    #           ACT ignores the language instruction and uses MEAN_STD stats.
    # =========================================================================

    policy: act

    robot:
      descriptor_id: sobit_home_v1_1
      # exclude trims the shared descriptor to this task's subset.
      # Unknown names raise.
      exclude:
        groups: ["arm_right", "hand_right"]
        cameras: ["hand_right_camera"]
        # Dataset carries no EE-pose features.
        ee_poses: [left, right]
        mobile_base: false

    dataset:
      repo_id: "team-sobits/sobit_home-pickup_the_block-left-abs-gazebo"
      num_workers: 12
      rename_map: []

    checkpoint:
      output_dir: ""
      resume: false
      overwrite: true
      # ACT trains from scratch — no pretrained policy checkpoint.
      pretrained_path: ""
      save_freq: 10000
      save_checkpoint: true

    training:
      # HF docs: ~100k steps ≈ a few hours on one GPU (ACT steps are fast).
      steps: 100000
      # Docs say start at 8; the 5090 affords 16 even at the native 1920x1200
      # hand camera (ACT does not resize images internally).
      batch_size: 16
      seed: 1000
      # ACT preset: AdamW lr=1e-5 (constant, no scheduler), weight_decay=1e-4.
      use_policy_training_preset: true
      log_freq: 200
      eval_freq: 5000

    num_gpus: 1

    wandb:
      enable: true
      project: "sobits_vla_training"
      entity: ""
      run_name: "sobit_home-pickup_block-left-abs-act"
      notes: "ACT from-scratch on sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions, left arm only)"
      disable_artifact: true

    hub:
      push_to_hub: true
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_act"
      private: false

    peft:
      # ACT is 80M params — always full training; LoRA is meaningless here.
      method_type: ""

    policy_overrides:
      # 50 steps @ 10 fps = 5 s, consistent with the deploy pipeline
      # (the ALOHA default of 100 assumes 50 Hz control).
      chunk_size: 50
      n_action_steps: 50
      use_vae: true
      kl_weight: 10.0
