/**:
  ros__parameters:
    # =========================================================================
    # SOBIT HOME "pickup_the_block" (Gazebo, left arm) — GR00T N1.7
    #
    # Launch  : ros2 launch sobits_vla_training sobits_vla_training.launch.py robot:=sobit_home_left_groot
    # Dataset : team-sobits/sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)
    # Policy  : GR00T N1.7-3B (Cosmos-Reason2-2B backbone + flow-matching head)
    # Base    : nvidia/GR00T-N1.7-3B, loaded via base_model_path (NOT
    #           checkpoint.pretrained_path); flash-attn optional (SDPA fallback)
    # Recipe  : GR00T-native post-training — projector + diffusion head on the
    #           frozen VLM via the tune_* flags, not lerobot PEFT.
    #
    # IMPORTANT: lerobot 0.6.0 dropped GR00T N1.5 entirely — existing N1.5
    # fine-tunes cannot be loaded and must be retrained against N1.7.
    # =========================================================================

    policy: groot

    robot:
      descriptor_id: sobit_home_v1_1
      # exclude trims the shared descriptor to this task's subset.
      # Unknown names raise.
      exclude:
        groups: ["arm_right", "hand_right"]
        cameras: ["hand_right_camera"]
        # Dataset carries no EE-pose features.
        ee_poses: [left, right]
        mobile_base: false

    dataset:
      repo_id: "team-sobits/sobit_home-pickup_the_block-left-abs-gazebo"
      num_workers: 12
      rename_map: []

    checkpoint:
      output_dir: ""
      resume: false
      overwrite: true
      # Empty: GR00T weights come from policy base_model_path (nvidia repo).
      pretrained_path: ""
      save_freq: 2500
      save_checkpoint: true

    training:
      # N1.7 derives warmup from training.steps via warmup_ratio (5%) instead
      # of N1.5's hardcoded 10k schedule, so steps can be tuned freely.
      steps: 10000
      batch_size: 16
      seed: 1000
      # GR00T preset: AdamW lr=1e-4, betas (0.9, 0.999), cosine decay.
      use_policy_training_preset: true
      log_freq: 100
      eval_freq: 5000

    num_gpus: 1

    wandb:
      enable: true
      project: "sobits_vla_training"
      entity: ""
      run_name: "sobit_home-pickup_block-left-abs-groot"
      notes: "GR00T N1.7 post-train (projector+diffusion head) on sobit_home-pickup_the_block-left-abs-gazebo (10 fps, absolute actions)"
      # Checkpoints live locally + on HF; skip the duplicate W&B upload.
      disable_artifact: true

    hub:
      push_to_hub: true
      repo_id: "team-sobits/sobit_home_pickup_block_left_abs_groot"
      private: false

    peft:
      # GR00T uses its OWN freezing (tune_* flags below), so lerobot PEFT stays
      # off. Its built-in LoRA fields were never wired up in N1.7.
      method_type: ""

    policy_overrides:
      # N1.7-native values set directly — GrootConfig would otherwise auto-remap
      # the legacy N1.5 defaults with a warning.
      chunk_size: 40
      n_action_steps: 40
      max_state_dim: 132
      max_action_dim: 132
      embodiment_tag: "new_embodiment"
      # Default post-training recipe: action head only, VLM frozen.
      tune_llm: false
      tune_visual: false
      tune_projector: true
      tune_diffusion_model: true
      tune_vlln: true
      use_bf16: true
