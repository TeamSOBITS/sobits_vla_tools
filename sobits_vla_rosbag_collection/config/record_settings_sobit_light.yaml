/**:
  ros__parameters:
    # Robot information
    robot_info:
      # Name of the robot
      name: "sobit_light"
      # Version of the robot
      version: "1.0.0"
      # Description of the robot
      morphology:
        # Type of the robot (e.g., "mobile_manipulator", "humanoid", "quadruped", etc.)
        type: "mobile_manipulator"
        # Essential control domains
        joint_states_topic: "/sobit_light/joint_states"
        parts:
          - head
          - manipulator
          - end_effector
          - mobile_base
        head:
          is_actionable: true
          topics:
            - "/sobit_light/head_joint_controller/controller_state"
            - "/sobit_light/head_joint_controller/joint_trajectory"
          actions:
            - "/sobit_light/head_joint_controller/follow_joint_trajectory"
          joint_names:
            - "head_yaw_joint"
            - "head_pitch_joint"
        manipulator:
          is_actionable: true
          topics:
            - "/sobit_light/arm_joint_controller/controller_state"
            - "/sobit_light/arm_joint_controller/joint_trajectory"
          actions:
            - "/sobit_light/arm_joint_controller/follow_joint_trajectory"
          joint_names:
            - "arm_shoulder_roll_joint"
            - "arm_shoulder_pitch_joint"
            - "arm_shoulder_pitch_sub_joint"
            - "arm_elbow_pitch_joint"
            - "arm_forearm_roll_joint"
            - "arm_wrist_pitch_joint"
            - "arm_wrist_roll_joint"
        end_effector:
          is_actionable: true
          topics:
            - "/sobit_light/hand_joint_controller/controller_state"
            - "/sobit_light/hand_joint_controller/joint_trajectory"
          actions:
            - "/sobit_light/hand_joint_controller/follow_joint_trajectory"
          joint_names:
            - "hand_joint"
            - "hand_sub_joint"
        mobile_base:
          is_actionable: true
          # Does the robot use Y-axis velocity (e.g. omni/mecanum wheels) or just X-axis (diff drive)?
          has_cmd_vel_y: false
          # Does the robot use Z-axis velocity (e.g. drones)?
          has_cmd_vel_z: false
          cmd_vel_topic: "/sobit_light/manual_control/cmd_vel"
          odom_topic: "/sobit_light/odometry/odometry"
          joint_names:
            - "base_l_drive_wheel_joint"
            - "base_r_drive_wheel_joint"
      # List of sensors on the robot
      sensors:
        types:
          - rgb_cam # color camera
          - depth_cam # depth camera
          - point_cloud
          - lidar # light detection and ranging sensor
        rgb_cam:
          names: ["head_camera", "hand_camera", "camera_front", "camera_rear"]
          models: ["realsense_d435", "realsense_d455", "unk", "unk"]
          topics:
            [
              "/sobit_light/head_camera/color/image_raw",
              "/sobit_light/hand_camera/color/image_raw",
              "/sobit_light/front_camera/image_raw",
              "/sobit_light/back_camera/image_raw",
            ]
          # camera_info topics (explicit — one per entry in 'topics', same order)
          info_topics:
            [
              "/sobit_light/head_camera/color/camera_info",
              "/sobit_light/hand_camera/color/camera_info",
              "/sobit_light/front_camera/camera_info",
              "/sobit_light/back_camera/camera_info",
            ]
          add_compressed: true # automatically also record the /compressed variant of each topic
          add_cam_info: true # automatically also record the /camera_info variant of each topic
        lidar:
          names: ["lidar_front"]
          models: ["unk"]
          topics: ["/sobit_light/lidar/scan"]

    # User information for contact
    user_info:
      # Name of the user
      name: ""
      # Location of the user
      location: ""
      # Contact email for the user
      email: ""

    # ROS bag recording configuration
    rosbag_config:
      # Path to the directory where the recorded bag files will be saved.
      # If left empty (""), the launcher will dynamically resolve it to the `rosbags` folder inside `sobits_vla_rosbag_collection`.
      record_directory: ""
      # The frame rate mapping for the LeRobot datasets
      fps: 10
      # The temporal discrepancy acceptable for synchronizing joints and images (in seconds)
      sync_threshold: 0.1
      # Additional topics to record beyond those inferred from sensor and morphology definitions
      additional_topics:
        - /sobit_light/velocity_controller/commands
        - /sobit_light/wheel_odometry/wheel_odometry
        - /sobit_light/odometry/odometry
        - /sobit_light/joy
        - /tf
        - /tf_static
      # Additional services to record (TODO: not available until ROS 2 Jazzy)
      additional_services:
        - ""
      # Additional actions to record (TODO: not available until ROS 2 Kilted)
      additional_actions:
        - ""
      # Format for the recorded bag files (e.g., "mcap", "sqlite3")
      conversion_format: "mcap"
      # Specify the compression mode ("none", "file", "message")
      compression_mode: "none"
      # If compression is enabled, specify the compression format ("zstd" or "lz4")
      compression_format: "zstd"
      # Specify the RMW serialization format ("cdr" or "rmw_fastrtps_cpp")
      rmw_serialization_format: "cdr"
