/**:
  ros__parameters:
    robot_info:
      name: "robot_name"
      version: "1.0.0"
      morphology:
        # Type of the robot (e.g., "mobile_manipulator", "humanoid", "quadruped", etc.)
        type: "mobile_manipulator"
        parts:
          - head
          - manipulator
          - end_effector
          - mobile_base
          # - legs
        head:
          joint_names:
            - "head_pan"
            - "head_tilt"
        manipulator:
          joint_names:
            - "arm_joint_1"
            - "arm_joint_2"
            - "arm_joint_3"
            - "arm_joint_4"
            - "arm_joint_5"
            - "arm_joint_6"
        end_effector:
          joint_names:
            - "gripper"
        mobile_base:
          # A part counts as a base only if cmd_vel_topic is set, whatever
          # the part is named.
          cmd_vel_topic: "/cmd_vel"
          joint_names:
            - "base_wheel_left"
            - "base_wheel_right"
        # legs:
        #   joint_names:
        #     - ""
      sensors:
        types:
          - rgbd # color and depth camera
          - lidar # light detection and ranging sensor
          - imu # inertial measurement unit
          - camera # regular camera
          - depth_camera # depth camera without color
          - fish_eye # fisheye camera
        rgbd:
          names: [""]
          models: [""]
        lidar:
          names: [""]
          models: [""]
        imu:
          names: [""]
          models: [""]
        camera:
          names: [""]
          models: [""]
        depth_camera:
          names: [""]
          models: [""]
        fish_eye:
          names: [""]
          models: [""]

    user_info:
      name: ""
      location: ""
      email: ""

    rosbag_config:
      # Where recorded bags land. Empty = the launch file resolves the
      # package's rosbags/ output root; a set value here always wins.
      record_directory: ""
      topics_to_record:
        - "/camera/image_raw"
        - "/camera/camera_info"
      # TODO: services not available until ROS 2 Jazzy
      services_to_record:
        - "/camera/get_image"
      # TODO: actions not available until ROS 2 Kilted
      actions_to_record:
        - "/robot/move_base"
      # Format for the recorded bag files (e.g., "mcap", "sqlite3")
      conversion_format: "mcap"
      # Specify the compression mode ("none", "file", "message")
      compression_mode: "none"
      # If compression is enabled, specify the compression format ("zstd" is the only supported compression format)
      compression_format: "zstd"
