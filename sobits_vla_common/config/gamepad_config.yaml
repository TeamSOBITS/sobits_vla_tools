/**:
  ros__parameters:
    # Shared gamepad defaults for the GamepadClient node (sobits_vla_common).
    # Loaded by both the collection and deploy launch files. The GamepadClient
    # translates button presses into sobits_interfaces/srv/VlaCommand requests
    # sent to the command_service below.
    gamepad:
      # Service the GamepadClient calls; each stage advertises its own
      # private ~/command, addressed here by owner-node name, and the name
      # also selects which button_mapping block below is read.
      # Collection launches override this with vla_rosbag_collection/command.
      #   collection: record/pause/save/delete, plus reset while stopped
      #               (ignored mid-recording so no teleport lands in the bag).
      #   deploy:     play toggles PLAY/STOP; reset always sends STOP (abort
      #               the episode + reset model state + reset the scene).
      command_service: "sobits_vla_deploy/command"
      # Substring that marks a command_service as the deploy stage.
      deploy_service_match: "deploy"
      # Active controller profile (selects which button_mapping block is used).
      controller: "quest"
      # Cooldown between accepted button presses (seconds).
      button_cooldown_duration: 0.5

      # Each controller carries its own collection/deploy blocks. The deploy
      # block also holds the deadman safety trigger, since the control differs
      # per controller. Only sobits_vla_deploy reads safety.*; rosbag
      # collection ignores it, so it cannot gate teleop recording.
      # trigger_index convention: negative = axis index (pressed when > 0.5),
      # non-negative = button index.
      dualshock4:
        button_mapping:
          collection:
            record: 7      # toggles record -> pause -> resume
            pause: 7
            save: 6        # save while recording/paused, delete once stopped
            delete: 6
            reset: 6
          deploy:
            play: 7        # toggles PLAY/STOP
            reset: 6
            safety:
              # Default ON: real-robot deploy must require a held deadman.
              # Set false explicitly for hands-off sim runs.
              enabled: true
              trigger_index: -4       # L2 axis
              # Counts as released when no Joy arrives within this window
              # (controller unplugged / driver died).
              joy_timeout_s: 0.5
      quest:
        button_mapping:
          collection:
            record: 4      # toggles record -> pause -> resume
            pause: 4
            save: 5        # save while recording/paused, delete once stopped
            delete: 5
            # X button, matching the pose button in sobits_teleop
            # config/<robot>/quest_vla.yaml so one press also re-poses.
            reset: 0
          deploy:
            play: 4        # toggles PLAY/STOP
            reset: 0
            safety:
              enabled: true
              # Right grip, axis 7 — the SAME control as teleop arm enable
              # (sobits_teleop config/sobit_home/quest.yaml arm_enable_axis).
              # Keep these two in sync.
              trigger_index: -7
              joy_timeout_s: 0.5
